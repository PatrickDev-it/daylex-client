name: Build and publish desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false
env:
  FLUTTER_VERSION: '3.47.2'
jobs:
  updater:
    uses: ./.github/workflows/updater-check.yml
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev xvfb gnome-keyring dbus-x11 unzip zip
      - name: Delivery integrity and rollback tests
        if: runner.os == 'Linux'
        run: |
          python -m pip install cryptography==46.0.4
          python -m unittest discover -s tests -v
      - name: Pinned Flutter SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/development/flutter"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cygpath -w "$HOME/development/flutter/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/development/flutter/bin" >> "$GITHUB_PATH"
          fi
      - name: Version and dependencies
        run: |
          python scripts/package.py --build "$((100 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          cd app
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          cd whatsapp_bridge
          npm ci --omit=dev --ignore-scripts
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        run: bash scripts/test.sh
      - name: Linux native credential vault
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash scripts/linux-vault-test.sh
      - name: Windows and Mac native credential vault
        if: runner.os != 'Linux'
        working-directory: app
        run: flutter test integration_test/credential_vault_test.dart -d '${{ matrix.platform }}' --no-pub
      - name: Windows and Linux release
        if: runner.os != 'macOS'
        working-directory: app
        run: flutter build '${{ matrix.platform }}' --release --no-pub
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup --yes --no-progress }
      - name: Universal Mac Node runtime
        if: runner.os == 'macOS'
        run: bash scripts/macos-node.sh
      - name: Mac updater integrity and rollback
        if: runner.os == 'macOS'
        run: python scripts/test-macos-updater.py
      - name: Configure Apple signing
        id: apple
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: bash scripts/apple-signing.sh
      - name: Mac package
        if: runner.os == 'macOS'
        working-directory: app
        env:
          DAYLEX_SIGN_IDENTITY: ${{ steps.apple.outputs.identity }}
          DAYLEX_NOTARY_PROFILE: ${{ steps.apple.outputs.profile }}
          DAYLEX_NOTARY_KEYCHAIN: ${{ runner.temp }}/daylex-signing.keychain-db
        run: |
          if [[ '${{ steps.apple.outputs.ready }}' == true ]]; then
            bash build_macos.sh
          else
            bash build_macos.sh --adhoc
            echo 'macOS DMG and update ZIP use ad-hoc signing. Not notarized; explicit Gatekeeper approval may be required.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Package distributable files
        run: python scripts/package.py --platform '${{ matrix.platform }}'
      - name: Packaged Windows startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/windows-smoke.ps1 -Archive (Get-ChildItem app/dist/daylex-windows-*.zip).FullName -Installer (Get-ChildItem app/dist/Daylex-Setup-*.exe).FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.platform }}
          path: app/dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [[ -f "$RUNNER_TEMP/daylex-signing.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/daylex-signing.keychain-db"; fi
  publish:
    needs: [build, updater]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-*
          path: release-input
          merge-multiple: true
      - run: python -m pip install cryptography==46.0.4
      - name: Sign update manifests and release inventory
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python scripts/sign-release.py
      - name: Deploy and verify website and updater
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: bash scripts/deploy.sh
      - name: GitHub release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github-release.py

