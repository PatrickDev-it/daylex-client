name: Recover delivery after infrastructure failures
on:
  workflow_run:
    workflows: ['Build and publish desktop', 'Build and publish PWA']
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: delivery-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'startup_failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recover current production workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/recover-actions.py
