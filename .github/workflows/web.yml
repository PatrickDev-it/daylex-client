name: Build and publish PWA
on:
  push:
    branches: [main]
    paths: ['app/**', 'web-tools/**', 'scripts/**', 'tests/**', '.github/workflows/web.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$HOME/development/flutter"
          echo "$HOME/development/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        run: |
          python scripts/package.py --build "$((100 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          cd app
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          cd ../web-tools
          npm ci --ignore-scripts
      - name: Browser storage, backup and recovery
        working-directory: web-tools
        run: npm test
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub
      - name: Browser compatibility, PDF and credential tests
        run: python scripts/test-web.py
      - name: Build self-hosted PWA
        run: python scripts/build-web.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-static
          path: app/build/web/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-static
          path: app/build/web/
      - run: python -m pip install cryptography==46.0.4
      - name: Sign web delivery inventory
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          export WEB_BUILD="$((100 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          python scripts/sign-web.py
      - name: Publish and verify PWA
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: bash scripts/deploy.sh web
