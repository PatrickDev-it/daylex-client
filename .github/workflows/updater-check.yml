name: Windows updater regression
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  updater:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualified Flutter and Dart toolchain
        run: python scripts/flutter_toolchain.py
      - name: Regression scenarios
        shell: pwsh
        run: |
          Push-Location app
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
          Pop-Location
          New-Item app/dist -ItemType Directory -Force | Out-Null
          ./scripts/test-windows-updater.ps1
