name: paper_agent
description: "PaperAgent — AI document workspace for professional PDFs."
publish_to: 'none'
version: 0.1.0+14

environment:
  sdk: ^3.13.2

dependencies:
  deskify: ^0.2.0
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_gen_ai_chat_ui: ^2.19.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^3.4.3
  intl: any
  lucide_icons_flutter: ^3.1.20
  url_launcher: ^6.3.2
  markdown: ^7.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  re_highlight: ^0.0.3
  syncfusion_flutter_core: 34.2.9
  syncfusion_flutter_pdfviewer: ^34.2.9
  uuid: ^4.6.0
  cryptography: ^2.9.0
  package_info_plus: ^10.2.2
  qr_flutter: ^4.1.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The strings are in lib/l10n/*.arb; `flutter gen-l10n` (run by pub get) writes AppLocalizations next to them.
  generate: true

  # Inter is used both by the app UI and embedded in exported PDFs.
  # The file names also let google_fonts (used by the chat package) resolve
  # Inter locally instead of downloading it at runtime.
  assets:
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
